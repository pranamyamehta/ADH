<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Tennis</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui,sans-serif; background:#10251d; color:#f5fff8 }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; }
    main { width:min(100vw, 1100px); padding:16px }
    header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:0 8px }
    h1 { margin:0; font-size:clamp(1.2rem,3vw,2rem) }
    #status { color:#c7f36b }
    canvas { display:block; width:100%; aspect-ratio:16/9; background:#236b4d; border:8px solid #c7f36b; border-radius:16px }
    .help { color:#c5d9cc; text-align:center; margin:10px 0 0 }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main>
  <div id="lobby"></div>
  <div id="results" style="display:none"></div>
  <header><h1>PHONE TENNIS</h1><strong id="score">YOU 0 — 0 AI</strong><span id="status">Keyboard ready · F / B to swing</span></header>
  <canvas id="court" width="960" height="540" aria-label="Tennis game"></canvas>
  <p class="help">Swing with your phone, or press F for forehand and B for backhand. First to 5 wins.</p>
</main>
<script src="lobby.js"></script>
<script>
(() => {
  const canvas = document.getElementById('court'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), statusEl = document.getElementById('status');
  const W = canvas.width, H = canvas.height, MY_Y = H - 58, AI_Y = 58, HIT_ZONE = 130;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  let gameMode = 'ai'; // 'ai' or 'pvp'
  let ball = { x: W / 2, y: H / 2, vx: 3, vy: 3 };
  let me = { x: W / 2 }, ai = { x: W / 2 }, score = { me: 0, ai: 0 };
  let running = false, last = performance.now(), aiDelay = 0, aiTarget = W / 2, flash = 0;
  let matchStartTime = Date.now();
  let currentRally = 0, longestRally = 0;

  let p1Stats = { swings: 0, hits: 0, forehands: 0, backhands: 0, peakPower: 0, totalPower: 0 };
  let p2Stats = { swings: 0, hits: 0, forehands: 0, backhands: 0, peakPower: 0, totalPower: 0 };

  function onSwing(m) {
    if (!running) return;
    const player = (m && m.player === 2) ? 2 : 1;
    const power = clamp(Number(m.power) || 0, 0, 1);
    const dir = m.dir === 'backhand' ? 'backhand' : 'forehand';

    if (player === 1) {
      p1Stats.swings++;
      if (dir === 'forehand') p1Stats.forehands++; else p1Stats.backhands++;
      p1Stats.peakPower = Math.max(p1Stats.peakPower, power);
      p1Stats.totalPower += power;

      if (ball.vy > 0 && Math.abs(ball.y - MY_Y) < HIT_ZONE) {
        ball.vy = -(5 + 7 * power);
        ball.vx = (dir === 'forehand' ? 1 : -1) * (2 + 3 * power) + (W / 2 - ball.x) * 0.01;
        p1Stats.hits++;
        currentRally++;
        longestRally = Math.max(longestRally, currentRally);
        statusEl.textContent = 'Player 1: Nice return!';
        flash = 12;
      }
    } else if (player === 2 && gameMode === 'pvp') {
      p2Stats.swings++;
      if (dir === 'forehand') p2Stats.forehands++; else p2Stats.backhands++;
      p2Stats.peakPower = Math.max(p2Stats.peakPower, power);
      p2Stats.totalPower += power;

      if (ball.vy < 0 && Math.abs(ball.y - AI_Y) < HIT_ZONE) {
        ball.vy = (5 + 7 * power);
        ball.vx = (dir === 'forehand' ? 1 : -1) * (2 + 3 * power) + (W / 2 - ball.x) * 0.01;
        p2Stats.hits++;
        currentRally++;
        longestRally = Math.max(longestRally, currentRally);
        statusEl.textContent = 'Player 2: Great shot!';
        flash = 12;
      }
    }
  }

  window.onTennisSwing = onSwing;

  // Keyboard controls: F/B for Player 1, Left/Right for Player 2
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key.toLowerCase();
    if (k === 'f') onSwing({ player: 1, power: 0.75, dir: 'forehand' });
    if (k === 'b') onSwing({ player: 1, power: 0.75, dir: 'backhand' });
    if (e.key === 'ArrowRight' || k === 'k') onSwing({ player: 2, power: 0.75, dir: 'forehand' });
    if (e.key === 'ArrowLeft' || k === 'j') onSwing({ player: 2, power: 0.75, dir: 'backhand' });
  });

  function updateScoreDisplay() {
    if (gameMode === 'pvp') {
      scoreEl.textContent = `P1 ${score.me} — ${score.ai} P2`;
    } else {
      scoreEl.textContent = `YOU ${score.me} — ${score.ai} AI`;
    }
  }

  function point(who) {
    currentRally = 0;
    score[who]++;
    updateScoreDisplay();
    running = score.me < 5 && score.ai < 5;

    statusEl.textContent = running
      ? (who === 'me' ? 'Point for Player 1!' : (gameMode === 'pvp' ? 'Point for Player 2!' : 'Point for AI!'))
      : (score.me === 5 ? 'PLAYER 1 WINS THE MATCH!' : (gameMode === 'pvp' ? 'PLAYER 2 WINS THE MATCH!' : 'AI WINS THE MATCH!'));

    ball = { x: W / 2, y: H / 2, vx: (Math.random() - 0.5) * 3, vy: who === 'me' ? 3 : -3 };

    if (!running && typeof window.showResults === 'function') {
      const durationSec = Math.max(1, Math.round((Date.now() - matchStartTime) / 1000));
      const report = {
        mode: gameMode,
        winner: score.me === 5 ? 'Player 1' : (gameMode === 'pvp' ? 'Player 2' : 'AI'),
        score: { p1: score.me, p2: score.ai },
        durationSeconds: durationSec,
        longestRally: longestRally,
        p1: {
          name: 'Player 1',
          swings: p1Stats.swings,
          hits: p1Stats.hits,
          accuracy: p1Stats.swings ? Math.round((p1Stats.hits / p1Stats.swings) * 100) : 0,
          forehands: p1Stats.forehands,
          backhands: p1Stats.backhands,
          peakPower: Math.round(p1Stats.peakPower * 100),
          peakSpeedKmh: Math.round(p1Stats.peakPower * 85 + 35),
          avgPower: p1Stats.swings ? Math.round((p1Stats.totalPower / p1Stats.swings) * 100) : 0,
          calories: Math.round(p1Stats.swings * 0.6 + durationSec * 0.08),
          intensity: p1Stats.peakPower > 0.8 ? '🔥 High Intensity' : p1Stats.peakPower > 0.5 ? '⚡ Cardio Active' : '🎾 Moderate'
        },
        p2: {
          name: gameMode === 'pvp' ? 'Player 2' : 'AI Bot',
          swings: p2Stats.swings,
          hits: p2Stats.hits,
          accuracy: p2Stats.swings ? Math.round((p2Stats.hits / p2Stats.swings) * 100) : 0,
          forehands: p2Stats.forehands,
          backhands: p2Stats.backhands,
          peakPower: Math.round(p2Stats.peakPower * 100),
          peakSpeedKmh: Math.round(p2Stats.peakPower * 85 + 35),
          avgPower: p2Stats.swings ? Math.round((p2Stats.totalPower / p2Stats.swings) * 100) : 0,
          calories: Math.round(p2Stats.swings * 0.6 + durationSec * 0.08),
          intensity: p2Stats.peakPower > 0.8 ? '🔥 High Intensity' : p2Stats.peakPower > 0.5 ? '⚡ Cardio Active' : '🎾 Moderate'
        }
      };
      window.showResults(report);
    }
  }

  function reset(mode) {
    if (mode) gameMode = mode;
    score = { me: 0, ai: 0 };
    p1Stats = { swings: 0, hits: 0, forehands: 0, backhands: 0, peakPower: 0, totalPower: 0 };
    p2Stats = { swings: 0, hits: 0, forehands: 0, backhands: 0, peakPower: 0, totalPower: 0 };
    currentRally = 0;
    longestRally = 0;
    matchStartTime = Date.now();
    updateScoreDisplay();
    running = true;
    statusEl.textContent = 'Match Started! Swing to play!';
    ball = { x: W / 2, y: H / 2, vx: 2.5, vy: 3 };
  }

  window.onGameStart = opts => {
    reset(opts?.mode);
  };

  function draw(now) {
    const dt = Math.min((now - last) / 16.67, 2);
    last = now;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#236b4d';
    ctx.fillRect(0, 0, W, H);

    // Court boundary lines & net
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 3;
    ctx.strokeRect(90, 30, W - 180, H - 60);
    ctx.beginPath();
    ctx.moveTo(90, H / 2);
    ctx.lineTo(W - 90, H / 2);
    ctx.moveTo(W / 2, 30);
    ctx.lineTo(W / 2, H - 30);
    ctx.stroke();

    if (running) {
      // Bottom racket auto-tracking to ball
      me.x += clamp(ball.x - me.x, -6 * dt, 6 * dt);

      if (gameMode === 'ai') {
        // AI tracking & returning
        aiDelay -= dt;
        if (aiDelay <= 0) {
          aiTarget = ball.x + (Math.random() - 0.5) * 80;
          aiDelay = 16 + Math.random() * 20;
        }
        ai.x += clamp(aiTarget - ai.x, -3.8 * dt, 3.8 * dt);
      } else {
        // In PvP, top racket glides smoothly towards ball for Player 2
        ai.x += clamp(ball.x - ai.x, -5.5 * dt, 5.5 * dt);
      }

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // Wall bounce
      if (ball.x < 100 || ball.x > W - 100) ball.vx *= -1;

      // AI return in AI mode
      if (gameMode === 'ai' && ball.vy < 0 && ball.y <= AI_Y + 18) {
        ball.vy = Math.abs(ball.vy);
        ball.vx = clamp(ai.x - ball.x, -5, 5) + (Math.random() - 0.5) * 2;
        p2Stats.hits++;
        p2Stats.swings++;
        currentRally++;
        longestRally = Math.max(longestRally, currentRally);
      }

      // Ball misses: Out of bounds
      if (ball.y > MY_Y + 24) point('ai');
      if (ball.y < AI_Y - 24) point('me');
    }

    // Draw paddles (Player 1 = Green, Player 2/AI = Orange)
    ctx.fillStyle = '#eaff8a';
    ctx.fillRect(me.x - 42, MY_Y, 84, 14);

    ctx.fillStyle = '#f3a65a';
    ctx.fillRect(ai.x - 42, AI_Y, 84, 14);

    // Draw ball
    ctx.fillStyle = '#fff36b';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 11, 0, Math.PI * 2);
    ctx.fill();

    // Hit flash effect
    if (flash > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (flash / 16) + ')';
      ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, W - 10, H - 10);
      flash--;
    }

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script></body></html>
